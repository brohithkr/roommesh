# Cheap checks for pull requests and main: the Rust core's tests + clippy, and the driver's ctest.
# No app build (that runs in release.yml, together with the app's unit tests).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16" # latest stable 16.x; keep in step with release.yml
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Core and driver tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config
          command -v cmake >/dev/null || brew install cmake # preinstalled on the macOS images
          cmake --version | head -n1

      - name: Install Rust
        id: rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc -V
          echo "version=$(rustc -V | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      - name: Cache cargo registry and core/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-${{ runner.arch }}-ci-rust${{ steps.rust.outputs.version }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-rust${{ steps.rust.outputs.version }}-

      - name: Core tests and clippy
        run: make test-core

      # Builds the driver (always universal), runs its ctest and ad-hoc signs it (no DEVELOPER_ID_APP).
      - name: Driver tests
        run: scripts/build-driver.sh
