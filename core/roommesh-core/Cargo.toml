[package]
name = "roommesh-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "roommesh_core"
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
getrandom = "0.3"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
